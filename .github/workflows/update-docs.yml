name: Auto-generate GitBook demo docs

on:
  workflow_dispatch:
  push:
    paths:
      - "feature.json"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generate demo product and documentation
        run: node scripts/generate-content.mjs

      - name: Start demo product
        run: |
          python3 -m http.server 4173 --directory product-demo >/tmp/demo.log 2>&1 &
          sleep 2

      - name: Capture screenshot
        run: node scripts/capture-screenshot.mjs

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs product-demo
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update docs and screenshot"
          git push
